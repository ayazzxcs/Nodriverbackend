name: Fetch Trending Products Nodriver

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: write

jobs:
  fetch-cj:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch CJ Trending Products
        run: node scripts/fetch-cj-products.js
        env:
          CJ_EMAIL: ${{ secrets.CJ_EMAIL }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}

      - name: Upload CJ Products
        uses: actions/upload-artifact@v4
        with:
          name: cj-products
          path: products.json

  google-trends:
    needs: fetch-cj
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Download CJ Products
        uses: actions/download-artifact@v4
        with:
          name: cj-products
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch Google Trends
        run: node scripts/fetch-google-trends.js
        env:
          GOOGLE_TRENDS_LIMIT: 500

      - name: Upload Google Trends
        uses: actions/upload-artifact@v4
        with:
          name: google-trends
          path: |
            google-trends.json
            trend-keywords.json

  amazon-nodriver:
    needs: fetch-cj
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Download CJ Products
        uses: actions/download-artifact@v4
        with:
          name: cj-products
          path: .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Chrome
        run: |
          google-chrome --version || true
          which google-chrome || true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U nodriver

      - name: Fetch Monthly Lens Amazon Matches with Nodriver
        run: xvfb-run -a python scripts/fetch-monthly-lens-amazon-nodriver.py
        env:
          MONTHLY_LENS_MAX_PRODUCTS: 50
          MONTHLY_LENS_START_INDEX: 0
          NODRIVER_PRODUCTS_PER_PROXY: 5
          NODRIVER_DELAY_MS: 2500
          AMAZON_PAGE_DELAY_MS: 3500
          AMAZON_MIN_TITLE_MATCH: 15
          RESIDENTIAL_PROXIES: ${{ secrets.RESIDENTIAL_PROXIES }}

      - name: Upload Amazon Nodriver Results
        uses: actions/upload-artifact@v4
        with:
          name: amazon-nodriver
          path: |
            amazon-products.json
            lens-amazon-matches.json
            lens-amazon-failures.json
            lens-amazon-meta.json

  merge:
    needs:
      - fetch-cj
      - google-trends
      - amazon-nodriver
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Download CJ Products
        uses: actions/download-artifact@v4
        with:
          name: cj-products
          path: .

      - name: Download Google Trends
        uses: actions/download-artifact@v4
        with:
          name: google-trends
          path: .

      - name: Download Amazon Nodriver Results
        uses: actions/download-artifact@v4
        with:
          name: amazon-nodriver
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Merge Trend Signals
        run: node scripts/merge-trend-signals.js

      - name: Commit Results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Update trending products nodriver" || echo "No changes"
          git push
