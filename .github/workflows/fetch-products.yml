name: Fetch Trending Products Nodriver Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-cj:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch CJ Trending Products
        run: node scripts/fetch-cj-products.js
        env:
          CJ_EMAIL: ${{ secrets.CJ_EMAIL }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}

      - name: Upload CJ Products
        uses: actions/upload-artifact@v4
        with:
          name: cj-products
          path: products.json

  amazon-nodriver:
    needs: fetch-cj
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Download CJ Products
        uses: actions/download-artifact@v4
        with:
          name: cj-products
          path: .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Chrome
        run: |
          google-chrome --version || true
          which google-chrome || true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U nodriver

      - name: Fetch Monthly Lens Amazon Matches with Nodriver
        run: xvfb-run -a python scripts/fetch-monthly-lens-amazon-nodriver.py
        env:
          MONTHLY_LENS_MAX_PRODUCTS: 50
          MONTHLY_LENS_START_INDEX: 0
          NODRIVER_PRODUCTS_PER_PROXY: 5
          NODRIVER_DELAY_MS: 2500
          AMAZON_PAGE_DELAY_MS: 3500
          AMAZON_MIN_TITLE_MATCH: 15
          RESIDENTIAL_PROXIES: ${{ secrets.RESIDENTIAL_PROXIES }}

      - name: Upload Amazon Nodriver Results
        uses: actions/upload-artifact@v4
        with:
          name: amazon-nodriver
          path: |
            amazon-products.json
            lens-amazon-matches.json
            lens-amazon-failures.json
            lens-amazon-meta.json
